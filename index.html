<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#151515;--muted:#70706c;--line:#e1e1dc;--soft:#efefea;--accent:#111;--good:#246b4a;--warn:#8a4b12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:64px;padding:0 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20}.brand{font-weight:850;letter-spacing:-.04em}.version{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 9px}.screen{max-width:1120px;margin:auto;padding:54px 24px 80px}.hero{max-width:800px;margin:7vh auto 0;text-align:center}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(42px,7vw,76px);line-height:.95;letter-spacing:-.06em;margin:14px 0 18px}.hero p{font-size:18px;line-height:1.5;color:var(--muted);max-width:620px;margin:0 auto 30px}.composer{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.06);text-align:left}.composer textarea{width:100%;border:0;outline:0;resize:none;min-height:145px;font-size:20px;line-height:1.45;padding:12px;background:transparent}.composer textarea::placeholder{color:#aaa}.url-row{display:flex;gap:8px;margin:0 0 10px}.url-row input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:0;background:#fafaf8}.url-row input:focus,.refine input:focus{border-color:#999}.composer-bottom{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}.left-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:680}.btn:hover{background:var(--soft)}.btn.primary{background:#111;color:#fff;border-color:#111;padding:12px 18px}.btn.primary:hover{background:#2b2b2b}.hint{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}.hidden{display:none!important}.loading{max-width:650px;margin:15vh auto;text-align:center}.spinner{width:38px;height:38px;border:3px solid #ddd;border-top-color:#111;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}.loading p{color:var(--muted)}.progress{height:4px;background:#e8e8e4;overflow:hidden;border-radius:99px;margin:24px auto;width:min(420px,90%)}.progress i{display:block;height:100%;width:35%;background:#111;animation:load 1.3s infinite ease-in-out}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}.work{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;position:sticky;top:84px}.panel h3{font-size:13px;margin:0 0 10px}.meta{font-size:11px;color:var(--muted);line-height:1.45;margin:0 0 14px}.slides-list{display:grid;gap:7px;max-height:65vh;overflow:auto}.slide-btn{display:flex;gap:9px;align-items:center;border:1px solid transparent;background:#f6f6f2;border-radius:10px;padding:8px;text-align:left}.slide-btn.active{border-color:#111;background:#fff}.num{width:28px;height:28px;border-radius:8px;background:#e7e7e2;display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 auto}.slide-btn.active .num{background:#111;color:#fff}.thumb-copy{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.source-dot{width:6px;height:6px;border-radius:50%;background:#aaa;flex:0 0 auto}.preview-area{min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}.toolbar-title{font-weight:780}.toolbar-actions{display:flex;gap:8px}.canvas-wrap{background:#deded9;border-radius:20px;padding:clamp(12px,3vw,28px);display:grid;place-items:center;min-height:520px}.canvas{width:min(100%,560px);aspect-ratio:4/5;background:#111;position:relative;overflow:hidden;border-radius:8px;box-shadow:0 25px 60px rgba(0,0,0,.2)}.canvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.74))}.copy{position:absolute;inset:0;padding:8%;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}.kicker{font-size:10px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;opacity:.72;margin-bottom:12px}.heading{font-size:clamp(27px,5vw,48px);font-weight:880;letter-spacing:-.05em;line-height:.98;white-space:pre-wrap}.body{font-size:clamp(13px,2vw,18px);line-height:1.36;margin-top:15px;max-width:92%;color:rgba(255,255,255,.9)}.cover .copy{justify-content:flex-end}.cover .heading{font-size:clamp(36px,6.3vw,62px);max-width:95%}.cover .body{font-size:clamp(14px,2.2vw,20px);max-width:88%}.insight .copy{justify-content:center}.insight .heading{text-align:center}.editor{background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:14px;padding:16px}.editor label{font-size:11px;font-weight:800;color:var(--muted);display:block;margin:0 0 7px;text-transform:uppercase;letter-spacing:.08em}.editor textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;min-height:70px;outline:none}.refine{display:flex;gap:8px;margin-top:12px}.refine input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--line);background:#fafaf8;border-radius:999px;padding:7px 10px;font-size:11px}.status{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}.banner{background:#eef6f0;border:1px solid #cfe4d6;color:#28583d;border-radius:12px;padding:11px 13px;font-size:12px;margin-bottom:12px}.banner.warn{background:#fff5e9;border-color:#efd7b7;color:#70400e}.source{display:flex;gap:9px;align-items:flex-start}.source strong{display:block;color:#234e37}.source small{display:block;color:var(--muted);margin-top:2px}.visual-tag{position:absolute;right:5%;top:5%;z-index:3;background:rgba(0,0,0,.52);color:#fff;border:1px solid rgba(255,255,255,.22);padding:5px 8px;border-radius:999px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:760px){.screen{padding:30px 14px 60px}.hero{margin-top:5vh}.hero p{font-size:16px}.composer textarea{min-height:125px;font-size:18px}.url-row{flex-direction:column}.work{grid-template-columns:1fr}.panel{position:static;order:2}.slides-list{grid-template-columns:repeat(5,1fr);max-height:none}.slide-btn{padding:5px;justify-content:center}.thumb-copy{display:none}.canvas-wrap{min-height:0}.toolbar{align-items:flex-start}.refine{flex-wrap:wrap}.refine input{min-width:100%}}

<body>
<div class="app"><header class="top"><div class="brand">Carousel Studio</div><div class="version">v34 · content intelligence</div></header><main id="main"></main></div>
<input id="photoInput" type="file" accept="image/*" multiple class="hidden">
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const app={idea:'',url:'',photos:[],source:null,slides:[],active:0,status:'',screen:'home'};
const palettes=[['#111','#fff'],['#eeeae2','#151515'],['#dce8e1','#14251d'],['#e8e0f0','#21162b'],['#eee6d6','#2b2418']];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function repairText(s){let t=String(s||'');for(let i=0;i<2;i++){if(/[ÃÂâ€™œ“”]/.test(t)){try{const fixed=decodeURIComponent(escape(t));if(fixed!==t)t=fixed;else break}catch(e){break}}}return t.replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&quot;/gi,'"').replace(/&#39;/gi,"'").replace(/\u00a0/g,' ').replace(/[ \t]{2,}/g,' ').trim()}
function absolute(u,base){try{return new URL(u,base).href}catch(e){return u}}
function render(){const main=$('#main');if(app.screen==='home')main.innerHTML=homeHTML();else if(app.screen==='loading')main.innerHTML=loadingHTML();else main.innerHTML=workHTML();wire()}
function homeHTML(){return `<section class="screen"><div class="hero"><div class="eyebrow">Da ideia à história visual</div><h1>O que você quer criar?</h1><p>Conte uma ideia, cole o texto ou dê um link. Eu descubro a história, o tamanho e o visual.</p><div class="composer"><textarea id="idea" placeholder="Ex.: Quero explicar por que três títulos do Real Madrid não vieram em sequência...">${esc(app.idea)}</textarea><div class="url-row"><input id="url" value="${esc(app.url)}" placeholder="Cole um link de uma matéria ou página pública (opcional)"><button class="btn" id="readUrl">Ler conteúdo</button></div><div class="composer-bottom"><div class="left-actions"><button class="btn" id="addPhotos">＋ Adicionar fotos</button></div><button class="btn primary" id="create">Criar meu carrossel</button></div><div class="hint">Você não precisa saber de marketing ou design. O número de slides é decidido pela história.</div></div></div></section>`}
function loadingHTML(){return `<section class="screen"><div class="loading"><div class="spinner"></div><h2>${esc(app.status||'Estou entendendo o conteúdo…')}</h2><p>Encontrando a ideia central, construindo a narrativa e escolhendo os visuais.</p><div class="progress"><i></i></div></div></section>`}
function labelVisual(s){return s.visualType==='article'?'da matéria':s.visualType==='web'?'encontrada':'IA'}
function workHTML(){const s=app.slides[app.active];if(!s)return '';return `<section class="screen">${app.source?`<div class="banner source"><div>✓</div><div><strong>${esc(app.source.title||'Conteúdo lido')}</strong><small>${esc(app.source.url)}</small></div></div>`:''}${app.status?`<div class="banner ${app.statusType==='warn'?'warn':''}">${esc(app.status)}</div>`:''}<div class="work"><aside class="panel"><h3>Seu carrossel</h3><p class="meta">${app.slides.length} ${app.slides.length===1?'slide':'slides'} · criado de acordo com o conteúdo</p><div class="slides-list">${app.slides.map((x,i)=>`<button class="slide-btn ${i===app.active?'active':''}" data-slide="${i}"><span class="num">${i+1}</span><span class="thumb-copy">${esc(x.heading)}</span><span class="source-dot" title="Visual ${esc(labelVisual(x))}"></span></button>`).join('')}</div><div style="margin-top:14px"><button class="btn" style="width:100%" id="newCar">＋ Novo carrossel</button></div></aside><section class="preview-area"><div class="toolbar"><div class="toolbar-title">Slide ${app.active+1} de ${app.slides.length}</div><div class="toolbar-actions"><button class="btn" id="story">Ver como história</button><button class="btn primary" id="export">Exportar</button></div></div><div class="canvas-wrap"><div class="canvas ${app.active===0?'cover':''} ${s.role==='insight'?'insight':''}" id="canvas">${s.image?`<img src="${esc(s.image)}" alt="">`:''}<div class="shade"></div>${s.visualType?`<div class="visual-tag">visual ${esc(labelVisual(s))}</div>`:''}<div class="copy"><div class="kicker">${esc(s.kicker||'')}</div><div class="heading">${esc(s.heading)}</div>${s.body?`<div class="body">${esc(s.body)}</div>`:''}</div></div></div><div class="editor"><label>O que você quer mudar?</label><div class="refine"><input id="refine" placeholder="Ex.: deixe a capa mais provocativa"><button class="btn primary" id="refineBtn">Ajustar</button></div><div class="chips"><button class="chip" data-refine="mais curto">Mais curto</button><button class="chip" data-refine="mais direto">Mais direto</button><button class="chip" data-refine="mais profissional">Mais profissional</button><button class="chip" data-refine="mais divertido">Mais divertido</button><button class="chip" data-refine="melhore a capa">Melhorar capa</button></div><div class="status">${app.source?`Fonte: ${esc(app.source.title||'página')}`:app.photos.length?`${app.photos.length} foto${app.photos.length>1?'s':''} enviada${app.photos.length>1?'s':''}`:'Conteúdo original'}</div></div></section></div></section>`}
function wire(){
 $('#idea')?.addEventListener('input',e=>app.idea=e.target.value);
 $('#url')?.addEventListener('input',e=>app.url=e.target.value.trim());
 $('#readUrl')?.addEventListener('click',async()=>{app.url=$('#url').value.trim();if(!app.url)return;await startFromUrl(false)});
 $('#create')?.addEventListener('click',create);
 $('#addPhotos')?.addEventListener('click',()=>$('#photoInput').click());
 $('#photoInput').onchange=async e=>{app.photos=[];for(const f of e.target.files){app.photos.push(await dataURL(f))}if(app.photos.length){app.status='Vou contar uma história a partir das suas imagens.';await create()}};
 $$('.slide-btn').forEach(b=>b.onclick=()=>{app.active=+b.dataset.slide;render()});
 $('#export')?.addEventListener('click',exportPNG);$('#story')?.addEventListener('click',story);
 $('#newCar')?.addEventListener('click',()=>{Object.assign(app,{idea:'',url:'',photos:[],source:null,slides:[],active:0,status:'',screen:'home'});render()});
 $('#refineBtn')?.addEventListener('click',()=>refine($('#refine').value));$$('.chip').forEach(b=>b.onclick=()=>refine(b.dataset.refine));
}
function dataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function create(){app.idea=$('#idea')?.value?.trim()||app.idea.trim();app.url=$('#url')?.value?.trim()||app.url.trim();if(!app.idea&&!app.url&&!app.photos.length){alert('Conte uma ideia, cole um texto, coloque um link ou adicione fotos.');return}if(app.url){await startFromUrl(true);return}app.source=null;app.screen='loading';app.status='Entendendo sua ideia…';render();await sleep(450);const source={title:'Conteúdo enviado',url:'',text:app.idea,images:[]};await makeCarousel(source);app.screen='work';render()}
async function startFromUrl(go){app.screen='loading';app.status='Lendo o conteúdo da página…';render();try{const source=await extractUrlContent(app.url);app.source=source;if(!source.text||source.text.length<180)throw new Error('Conteúdo insuficiente');app.idea=source.text;app.status='Encontrando a história e as imagens…';render();await sleep(250);await makeCarousel(source);app.screen='work';render()}catch(e){app.source=null;app.statusType='warn';app.status='Não consegui acessar conteúdo suficiente dessa página. Tente uma página pública ou cole o texto da matéria. Não vou inventar conteúdo para preencher o carrossel.';app.screen='home';render()}}
async function extractUrlContent(url){let clean=/^https?:\/\//i.test(url)?url:'https://'+url;const endpoint='https://r.jina.ai/'+clean;const res=await fetch(endpoint,{headers:{Accept:'text/plain'}});if(!res.ok)throw new Error('Falha ao ler página');const raw=repairText(await res.text());if(raw.length<200)throw new Error('Conteúdo insuficiente');const title=repairText((raw.match(/^Title:\s*(.+)$/mi)||[])[1]||'');const lines=raw.replace(/\r/g,'').split('\n');const images=[];const kept=[];for(const line of lines){const m=[...line.matchAll(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)(?:\s+"[^"]*")?\)/g)];if(m.length){m.forEach(x=>{const u=absolute(x[2],clean);if(!images.some(i=>i.url===u))images.push({url:u,alt:repairText(x[1]||'')})});continue}if(!/^Title:\s*/i.test(line)&&!/^URL Source:\s*/i.test(line)&&!/^Published Time:\s*/i.test(line))kept.push(line)}const text=repairText(kept.join('\n')).replace(/\n{3,}/g,'\n\n').slice(0,30000);return{url:clean,title:title||clean,text,images:images.slice(0,20)}}
function paragraphs(text){return repairText(text).split(/\n{2,}/).map(x=>x.replace(/^[-*•]\s*/,'').trim()).filter(x=>x.length>=45)}
function sentences(text){return repairText(text).replace(/\n/g,' ').split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.length>=35)}
function cleanTitle(t){return repairText(t).replace(/^#+\s*/,'').replace(/[|•·].*$/,'').trim()}
function makeHook(title,paras){const t=cleanTitle(title);const first=paras[0]||'';const nums=(t.match(/\d+(?:[.,]\d+)?/g)||[]);if(nums.length&&t.length<110)return {heading:t,body:first.slice(0,150)};if(t&&t.length<=90){const lower=t.toLowerCase();if(/\?|por que|como|o que|quando|onde|qual/.test(lower))return{heading:t,body:first.slice(0,150)};return{heading:t,body:first?first.slice(0,150):''}}const s=sentences(first)[0]||t||'Uma história que merece ser vista de outro jeito.';const words=s.split(/\s+/);const hook=words.length>13?words.slice(0,13).join(' ')+'…':s;return{heading:hook,body:t&&t!==hook?t.slice(0,120):''}}
function scrollStopCover(title,paras){const candidates=[];const h=makeHook(title,paras);candidates.push(h);const first=sentences(paras[0]||'')[0];if(first){const n=first.match(/\d+(?:[.,]\d+)?/g);if(n)candidates.push({heading:`${n[0]}: o detalhe que muda essa história`,body:title.slice(0,130)});const contrast=first.match(/\bmas\b|\bporém\b|\bsó que\b/i);if(contrast)candidates.push({heading:first.split(/\bmas\b|\bporém\b|\bsó que\b/i)[0].trim()+' — e o que vem depois?',body:title.slice(0,120)})}candidates.push({heading:title?`${title.replace(/[.!?]+$/,'')} — o que realmente importa`:h.heading,body:h.body});return candidates.sort((a,b)=>scoreHook(b)-scoreHook(a))[0]}
function scoreHook(x){let s=0;const h=x.heading||'';if(h.length<90)s+=20;if(/[?]/.test(h))s+=16;if(/\d/.test(h))s+=12;if(/não|nunca|mas|porém|segredo|ninguém|realmente|por que|como/i.test(h))s+=15;if(/[.!]/.test(h))s+=6;s+=Math.max(0,20-Math.max(0,h.length-70));return s}
function dynamicSlides(source){const ps=paragraphs(source.text);const ss=sentences(source.text);if(ps.length<2&&ss.length<4)throw new Error('Pouco conteúdo');const hook=scrollStopCover(source.title||cleanTitle(ss[0]||''),ps);let units=ps.slice(0,14);if(units.length<4)units=ss.slice(0,8);const usable=units.filter((u,i)=>u!==hook.heading&&u.length>35);let count=Math.max(4,Math.min(12,Math.ceil(usable.length/1.35)+2));if(usable.length<=4)count=5;if(usable.length>=11)count=9;if(usable.length>=15)count=10;const contentCount=count-2;const selected=[];for(let i=0;i<contentCount;i++){const idx=Math.floor(i*usable.length/contentCount);selected.push(usable[idx]||usable[i%usable.length])}const slides=[{role:'cover',kicker:'PARE O SCROLL',heading:hook.heading,body:hook.body}];selected.forEach((u,i)=>{const clean=u.replace(/^#+\s*/,'');const bits=clean.split(/(?<=[.!?])\s+/);let heading=bits[0]||clean;let body=bits.slice(1).join(' ');if(heading.length>105){const ws=heading.split(/\s+/);heading=ws.slice(0,16).join(' ')+'…';body=clean.slice(heading.length).trim()}if(body.length>180)body=body.slice(0,177)+'…';slides.push({role:'content',kicker:String(i+1).padStart(2,'0'),heading,body})});const last=usable[usable.length-1]||ss[ss.length-1]||'';slides.push({role:'insight',kicker:'PARA LEVAR',heading:insightFrom(last),body:''});return slides}
function insightFrom(t){const s=repairText(t);const words=s.replace(/[^\p{L}\p{N}\s]/gu,'').split(/\s+/).filter(Boolean);if(words.length<=15)return s.replace(/[.!?]+$/,'');const start=words.slice(0,12).join(' ');return start+'…';}
async function makeCarousel(source){let slides=dynamicSlides(source);const articleImages=source.images||[];let webImages=[];if(articleImages.length<slides.length){for(const q of [source.title,cleanTitle(slides[1]?.heading||''),cleanTitle(slides[2]?.heading||'')]){if(!q)continue;const found=await openverse(q);webImages.push(...found);if(webImages.length>=slides.length)break}}await assignVisuals(slides,articleImages,webImages,source);app.slides=slides;app.active=0;app.status=`Criei ${slides.length} slides porque é o tamanho que a história pede.`}
async function openverse(q){try{const res=await fetch('https://api.openverse.org/v1/images/?q='+encodeURIComponent(q||'')+'&page_size=8');if(!res.ok)return[];const d=await res.json();return(d.results||[]).map(x=>({url:x.thumbnail||x.url,alt:repairText(x.title||'')})).filter(x=>/^https?:\/\//i.test(x.url))}catch(e){return[]}}
function proxyImage(u){return 'https://images.weserv.nl/?url='+encodeURIComponent(u)+'&w=1200&h=1500&fit=cover'}
async function assignVisuals(slides,article,web,source){let aiNeeded=[];for(let i=0;i<slides.length;i++){const s=slides[i];const context=(s.heading+' '+s.body).toLowerCase();let pick=null;if(article.length){pick=article.find(x=>{const a=(x.alt||'').toLowerCase();return a&&context.split(/\s+/).some(w=>w.length>5&&a.includes(w))})||article[i%article.length]}if(!pick&&web.length)pick=web[i%web.length];if(pick){s.image=proxyImage(pick.url);s.visualType=article.includes(pick)?'article':'web'}else{const ai=await generateVisual(s,source);if(ai){s.image=ai;s.visualType='ai'}}}}
async function generateVisual(slide,source){try{const prompt=`Editorial magazine image, no text, vertical 4:5, visually striking. Subject: ${slide.heading}. Context: ${source.title||source.text.slice(0,220)}. Realistic, premium, natural composition.`;return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=1080&height=1350&nologo=true&enhance=true'}catch(e){return null}}
function refine(text){const q=String(text||'').toLowerCase();if(!q)return;const current=app.slides[app.active];if(q.includes('curto')){current.heading=current.heading.split(/\s+/).slice(0,10).join(' ');current.body=current.body.split(/\s+/).slice(0,22).join(' ')}if(q.includes('direto')){current.heading=current.heading.replace(/^Talvez /i,'').replace(/ realmente /i,' ');current.body=current.body.replace(/\b(pode|poderia)\b/gi,'').trim()}if(q.includes('profissional')){current.heading=current.heading.replace(/[!]/g,'.');current.body=current.body.replace(/\blegal\b/gi,'relevante')}if(q.includes('divertido'))current.heading=current.heading.replace(/[.!?]+$/,'')+'?';if(q.includes('capa')||q.includes('provoc')){const c=app.slides[0];const old=c.heading;c.heading=makeStrongerCover(old,c.body);app.active=0}render()}
function makeStrongerCover(h,b){const clean=String(h||'').replace(/[.!?]+$/,'');if(/\?$/.test(clean))return clean;if(/\d/.test(clean))return clean+' — e isso não é coincidência';if(/não|nunca|mas|porém/i.test(clean))return clean+' — o detalhe que quase passa despercebido';return clean+' — o que ninguém conta sobre isso'}
function renderCanvasOnly(){const c=$('#canvas');if(!c)return;const s=app.slides[app.active];c.innerHTML=`${s.image?`<img src="${esc(s.image)}" alt="">`:''}<div class="shade"></div>${s.visualType?`<div class="visual-tag">visual ${esc(labelVisual(s))}</div>`:''}<div class="copy"><div class="kicker">${esc(s.kicker)}</div><div class="heading">${esc(s.heading)}</div>${s.body?`<div class="body">${esc(s.body)}</div>`:''}</div>`}
function wrap(ctx,text,max){const out=[];let line='';for(const w of String(text).split(/\s+/)){const test=line?line+' '+w:w;if(ctx.measureText(test).width>max&&line){out.push(line);line=w}else line=test}if(line)out.push(line);return out}
async function canvasFor(s,i){const el=document.createElement('canvas');const W=1080,H=1350;el.width=W;el.height=H;const ctx=el.getContext('2d');const [bg,fg]=palettes[i%palettes.length];ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);if(s.image){await new Promise(resolve=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{const r=Math.max(W/im.width,H/im.height);const iw=im.width*r,ih=im.height*r;ctx.drawImage(im,(W-iw)/2,(H-ih)/2,iw,ih);ctx.fillStyle='rgba(0,0,0,.58)';ctx.fillRect(0,0,W,H);resolve()};im.onerror=resolve;im.src=s.image})}ctx.fillStyle=fg;ctx.textAlign=s.role==='insight'?'center':'left';ctx.font='800 28px Inter,Arial';ctx.fillText((s.kicker||'').toUpperCase(),s.role==='insight'?W/2:92,145);ctx.font=`850 ${s.role==='cover'?76:60}px Inter,Arial`;let y=s.role==='insight'?540:430;for(const line of wrap(ctx,s.heading,850)){ctx.fillText(line,s.role==='insight'?W/2:92,y);y+=s.role==='cover'?86:72}if(s.body){ctx.font='400 30px Inter,Arial';y+=28;for(const line of wrap(ctx,s.body,790)){ctx.fillText(line,s.role==='insight'?W/2:92,y);y+=42}}return el.toDataURL('image/png')}
async function exportPNG(){const data=await canvasFor(app.slides[app.active],app.active);const a=document.createElement('a');a.href=data;a.download=`carousel-v34-slide-${String(app.active+1).padStart(2,'0')}.png`;a.click()}
function story(){let i=0;const overlay=document.createElement('div');overlay.style='position:fixed;inset:0;background:#111;z-index:100;display:grid;place-items:center';overlay.innerHTML=`<div id="storyCanvas" style="width:min(92vw,520px);aspect-ratio:4/5"></div><button id="closeStory" style="position:fixed;top:18px;right:18px;border:1px solid #444;background:#222;color:#fff;border-radius:999px;padding:10px 14px">Fechar</button>`;document.body.appendChild(overlay);const show=()=>{const s=app.slides[i],box=$('#storyCanvas');box.innerHTML=`<div class="canvas ${i===0?'cover':''} ${s.role==='insight'?'insight':''}" style="width:100%;height:100%;border-radius:0">${s.image?`<img src="${esc(s.image)}">`:''}<div class="shade"></div><div class="copy"><div class="kicker">${esc(s.kicker)}</div><div class="heading">${esc(s.heading)}</div>${s.body?`<div class="body">${esc(s.body)}</div>`:''}</div></div>`};show();overlay.onclick=e=>{if(e.target.id==='closeStory')return;if(e.clientX>innerWidth/2)i=Math.min(app.slides.length-1,i+1);else i=Math.max(0,i-1);show()};$('#closeStory').onclick=()=>overlay.remove()}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
render();
</script>
