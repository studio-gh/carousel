name: React beta quality gate

on:
  pull_request:
    branches: [main, react-beta-foundation]
  push:
    branches: [react-beta-foundation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: react-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: React beta checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Confirm the React workspace exists
        run: test -f apps/react/package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile if missing
        working-directory: apps/react
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Install from lockfile
        working-directory: apps/react
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: apps/react
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/react
        run: npm run test -- --run
      - name: Production build
        working-directory: apps/react
        run: npm run build
