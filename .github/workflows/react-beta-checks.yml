name: React beta quality gate

on:
  pull_request:
    branches: [main, react-beta-foundation]
  push:
    branches: [react-beta-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Repository and lockfile guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confirm the React app is present
        shell: bash
        run: test -f apps/react/package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/react/package-lock.json
      - name: Install pinned React dependencies
        working-directory: apps/react
        run: npm install --no-audit --no-fund
      - name: Type check
        if: hashFiles('apps/react/package.json') != ''
        working-directory: apps/react
        run: npm run typecheck
      - name: Unit tests
        if: hashFiles('apps/react/package.json') != ''
        working-directory: apps/react
        run: npm run test -- --run
      - name: Production build
        if: hashFiles('apps/react/package.json') != ''
        working-directory: apps/react
        run: npm run build
